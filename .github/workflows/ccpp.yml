name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: texlive/texlive:latest

    steps:
      # Checkout code
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # hash.sh needs the C preprocessor; without it every hash
      # in the PDF is d41d8c (md5 of empty input).
      - name: Install cpp
        run: apt-get update && apt-get install -y --no-install-recommends cpp

      # Build PDF
      - name: Build PDF
        run: make hcmus </dev/null

      # Configure Git for commits
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # On PRs, expose the PDF for review instead of pushing it
      - name: Upload PDF
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hcmus-pdf
          path: hcmus.pdf

      # Commit & Push changes (if any); a PR's merge ref can't be pushed
      - name: Commit and Push changes
        if: github.event_name != 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Recompile PDF [skip ci]"
          git push origin HEAD:${{ github.ref }}
